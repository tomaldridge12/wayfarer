# The Guide's stage timeline: the points of a normal playthrough every reward is placed against.
# marker: the vanilla advancement that marks reaching the stage (the same ones core snapshots).
stages:
  - id: iron
    name: Iron
    marker: Acquire Hardware
    item: iron_ingot
    blurb: First furnace, first iron. The world is still big and you are still small.
  - id: diamond
    name: Diamond
    marker: Diamonds!
    item: diamond
    blurb: Deep caves, enchanting tables, the first real gear.
  - id: nether
    name: Nether
    marker: We Need to Go Deeper
    item: netherrack
    blurb: Through the portal, into fortresses and bastions, out with netherite.
  - id: post_end
    name: Post-End
    marker: Free the End
    item: elytra
    blurb: The dragon is down, the surface is safe, and the long road opens up.

