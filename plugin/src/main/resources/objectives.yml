  into_the_fire: {name: "Into the Fire", text: "Defeat {n} Nether mobs", counts: [kill:blaze, kill:ghast, kill:hoglin, kill:piglin_brute, kill:magma_cube, kill:wither_skeleton, kill:zoglin], target: 600, stage: nether, table: nether}
  quartz_rush: {name: "Quartz Rush", text: "Mine {n} nether quartz ore", counts: [mine:nether_quartz_ore], target: 1500, stage: nether, table: nether}
  end_of_days: {name: "End of Days", text: "Defeat {n} endermen and shulkers", counts: [kill:enderman, kill:shulker], target: 500, stage: end, table: end}

# Weekend events, from schedule.event-start to event-end: one per weekend, in rotation order. Each switches on a
# modifier (double_catch: every fish caught twice; crop_growth: tick-speed raised in the Overworld; ore_xp: ores give
# multiplier times the experience; mob_drops: mobs drop multiplier times their loot), has its own goal for everyone,
# and pays every contributor a roll from table's event tier when the goal is met. Modifiers undo themselves when the
# event ends or the plugin stops.
events:
  rotation: [drowned_tide, harvest_moon, deep_rush, bone_night]
  list:
    drowned_tide:
      name: "The Drowned Tide"
      blurb: "The water's thick with fish: every catch comes up twice."
      modifier: double_catch
      goal: {name: "The Tide's Bounty", text: "Catch {n} fish between you", counts: ["catch:*"], target: 400}
    harvest_moon:
      name: "Harvest Moon"
      blurb: "Crops grow like they've been told a secret."
      modifier: crop_growth
      tick-speed: 12
      goal: {name: "Moonlit Harvest", text: "Harvest {n} crops between you", counts: ["harvest:*"], target: 2500}
    deep_rush:
      name: "Deep Rush"
      blurb: "Every seam glitters: ores give twice the experience."
      modifier: ore_xp
      multiplier: 2
      goal: {name: "Down the Seams", text: "Mine {n} ore between you", counts: ["mine:#minecraft:coal_ores", "mine:#minecraft:iron_ores", "mine:#minecraft:copper_ores", "mine:#minecraft:gold_ores", "mine:#minecraft:redstone_ores", "mine:#minecraft:lapis_ores", "mine:#minecraft:diamond_ores", "mine:#minecraft:emerald_ores"], target: 1500}
    bone_night:
      name: "Bone Night"
      blurb: "The dead walk with full pockets: skeletons drop twice the loot."
      modifier: mob_drops
      mobs: [skeleton, stray, bogged, parched, wither_skeleton]
      multiplier: 2
      goal: {name: "Rattle Their Bones", text: "Defeat {n} skeletons between you", counts: [kill:skeleton, kill:stray, kill:bogged, kill:parched, kill:wither_skeleton], target: 500}

# The tokens shop: looks and conveniences, never power. Only these keys can be sold; relics, ingots, marks, curios and
# enchants nobody has unlocked are not for sale and cannot be added. Prices in tokens.
#   cosmetics: titles, trails, plain hats and pets (feat-only cosmetics and every hat with an ability are left out on purpose)
#   extra-reroll: one more free reroll, once a day; template-copy: a copy of an alloy or mark template you have owned
#   wayfinder: a Wayfinder pointing; beacon-kindling: calls a wandering trader (both need the exploration module)
#   supplies: supply id -> price; enchant-per-level: a book of an enchant you have unlocked costs this times its level
shop:
  cosmetics: {wayfarer: 150, trailblazer: 200, night_owl: 200, hearth_keeper: 200, embers: 250, petals: 250, notes: 300,
    sparkles: 300, bubbles: 250, snowfall: 250, pumpkin_hat: 250, cake_hat: 250, lantern_hat: 300, mushroom_cap: 250,
    piglet: 400, chick: 350, bunny: 400, kit: 500, top_hat: 350, propeller_beanie: 300, wizard_hat: 400}
  extra-reroll: 40
  template-copy: 120
  wayfinder: 60
  beacon-kindling: 80
  supplies: {seed_bundle: 30, floral_bundle: 30, mushy_bundle: 30, animal_crate: 80, wayfarers_bait: 40, tome_of_experience: 50}
  enchant-per-level: 60

