# Objectives module: feats (odd one-off milestones), dailies and the weekly, the server goal, weekend events, tokens
# and the shop. Set enabled: false to skip the module. Every number here is a first pass, to be tuned from play.
version: 2
enabled: true

# The tracker: players put objectives (and later feats, goals) on a sidebar; max is how many at once (1 to 15).
tracker:
  max: 5

# How worn hats look. scale: a hat's width in blocks (a head is 0.5 wide); raise: the gap in blocks between the top of the
# head and the hat's base. Keep the hat small and raised a little or it fills your view in first person. Reload applies it.
hats:
  scale: 0.45
  raise: 0.1

# Cosmetics: titles (shown before your name in chat and the tab list), trails (particles behind you as you move), hats and
# pets. Feats pay some; the shop sells others. You wear one of each kind, chosen in the Wardrobe.
#   kind: title, trail, hat or pet; name; colour (titles); particle (trails: a particle name, with colour: for dust);
#   item (hats); entity or model, pet-name, baby, scale (pets).
