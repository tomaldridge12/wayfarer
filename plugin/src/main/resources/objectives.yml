  sheer_joy: {name: "Sheer Joy", text: "Shear {n} sheep", counts: [shear:sheep], target: 12, stage: start, table: farming, tokens: 10}
  matchmaker: {name: "Matchmaker", text: "Breed {n} animals", counts: ["breed:*"], target: 10, stage: start, table: farming, tokens: 10}
