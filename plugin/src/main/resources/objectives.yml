  root_and_branch: {name: "Root and Branch", text: "Harvest {n} carrots or potatoes", counts: [harvest:carrots, harvest:potatoes], target: 64, stage: start, table: farming, tokens: 10}
  beet_it: {name: "Beet It", text: "Harvest {n} beetroots", counts: [harvest:beetroots], target: 48, stage: start, table: farming, tokens: 10}
  melon_patch: {name: "Melon Patch", text: "Harvest {n} melons", counts: [harvest:melon], target: 32, stage: start, table: farming, tokens: 10}
  pumpkin_spice: {name: "Pumpkin Spice", text: "Harvest {n} pumpkins", counts: [harvest:pumpkin], target: 24, stage: start, table: farming, tokens: 10}
