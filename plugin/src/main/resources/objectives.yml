  all_that_glitters: {name: "All That Glitters", text: "Mine {n} gold ore", counts: [mine:gold_ore, mine:deepslate_gold_ore, mine:nether_gold_ore], target: 16, stage: iron, table: mining, tokens: 12}
  diamond_eyes: {name: "Diamond Eyes", text: "Mine {n} diamond ore", counts: [mine:diamond_ore, mine:deepslate_diamond_ore], target: 4, stage: iron, table: mining, tokens: 16}
  emerald_city: {name: "Emerald City", text: "Mine {n} emerald ore", counts: [mine:emerald_ore, mine:deepslate_emerald_ore], target: 3, stage: iron, table: mining, tokens: 18}
  crystal_clear: {name: "Crystal Clear", text: "Mine {n} amethyst clusters", counts: [mine:amethyst_cluster], target: 12, stage: iron, table: mining, tokens: 12}
  # Digging
  sandcastles: {name: "Sandcastles", text: "Dig {n} sand", counts: [mine:sand, mine:red_sand], target: 128, stage: start, table: digging, tokens: 8}
  gravel_matters: {name: "Gravel Matters", text: "Dig {n} gravel", counts: [mine:gravel], target: 96, stage: start, table: digging, tokens: 8}
  mud_pie: {name: "Mud Pie", text: "Dig {n} mud", counts: [mine:mud], target: 48, stage: start, table: digging, tokens: 10}
  clay_day: {name: "Clay Day", text: "Dig {n} clay", counts: [mine:clay], target: 32, stage: start, table: digging, tokens: 10}
  dirt_cheap: {name: "Dirt Cheap", text: "Dig {n} dirt or grass", counts: [mine:dirt, mine:grass_block, mine:coarse_dirt], target: 192, stage: start, table: digging, tokens: 6}
  snow_day: {name: "Snow Day", text: "Dig {n} snow", counts: [mine:snow_block, mine:snow, mine:powder_snow], target: 64, stage: start, table: digging, tokens: 8}
  # Farming
