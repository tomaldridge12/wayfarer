  crown: {kind: hat, name: "Crown", item: wayfarer:hat/crown}
  # A hat with an ability gives a small perk (curios.yml, hat-abilities) while worn. The shop never sells these;
  # reward tables and feats pay them.
  lamp_cap: {kind: hat, name: "Lamp Cap", item: redstone_lamp, ability: lamplight}
  feather_cap: {kind: hat, name: "Feather Cap", item: feather, ability: featherlight}
  straw_hat: {kind: hat, name: "Straw Hat", item: hay_block, ability: green_thumb}
  lodestone_cap: {kind: hat, name: "Lodestone Cap", item: lodestone, ability: lodestone_pull}
  lily_hat: {kind: hat, name: "Lily Hat", item: lily_pad, ability: lily_luck}
  magma_crown: {kind: hat, name: "Magma Crown", item: magma_block, ability: fireproof_brim}
  # Pets follow you and vanish when you log out, ride or die. entity: a peaceful baby mob; pet-name "jeb_" makes a sheep
  # shift through every colour; model: a pack model shown as a small floating display (scale up to 4).
