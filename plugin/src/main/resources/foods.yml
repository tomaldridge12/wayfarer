      hint: "A farmhouse breakfast with all the trimmings."
    pumpkin_soup:
      name: "Pumpkin Soup"
      colour: "#E39A3C"
      family: farming
      base: pumpkin_pie
      nutrition: 10
      saturation: 14.0
      effects: [{type: absorption, minutes: 5}]
      ingredients: [pumpkin, "forage:onion", milk_bucket, bowl]
      flavour: "Orange, warm and quietly sustaining."
      hint: "A harvest soup for autumn."
    tomato_soup:
      name: "Tomato Soup"
      colour: "#C9402E"
      family: farming
      base: mushroom_stew
      nutrition: 8
      saturation: 11.0
      effects: [{type: saturation, minutes: 0.25}]
      ingredients: ["forage:tomato*2", "forage:wild_herbs", bowl]
      flavour: "A red cup of summer in a cold week."
      hint: "A simple soup. Tomatoes grow wild on warm grass."
    cabbage_rolls:
      name: "Cabbage Rolls"
      colour: "#9CC078"
      family: farming
      base: cooked_beef
      nutrition: 10
      saturation: 14.0
      effects: [{type: absorption, minutes: 4}]
      ingredients: ["forage:cabbage*2", "forage:wild_rice", cooked_beef]
      flavour: "Wrapped carefully, opened gladly."
      hint: "A tidy supper. Cabbage grows wild on windy slopes."
    fried_rice:
      name: "Fried Rice"
      colour: "#E3CC8A"
      family: farming
      base: baked_potato
      nutrition: 10
      saturation: 14.0
      effects: [{type: saturation, minutes: 0.25}]
      ingredients: ["forage:wild_rice", egg, "forage:onion", "forage:wild_herbs"]
      flavour: "Yesterday's rice, made into today's best meal."
      hint: "Rice with whatever is to hand."
    vegetable_soup:
      name: "Vegetable Soup"
      colour: "#C98A4A"
      family: farming
      base: beetroot_soup
      nutrition: 10
      saturation: 14.0
      effects: [{type: health_boost, minutes: 5}]
      ingredients: [carrot, potato, "forage:onion", "forage:cabbage", bowl]
      flavour: "A little of everything the garden gave."
      hint: "A plain soup that does more than it looks."
    honey_bun:
      name: "Honey Bun"
      colour: "#D9A441"
      family: farming
      base: bread
      nutrition: 6
      saturation: 9.0
      effects: [{type: speed, minutes: 3}]
      ingredients: ["wheat*2", honey_bottle, sugar]
      flavour: "Sticky, warm and gone before the tray cooled."
      hint: "A sweet bun from the bakehouse."
    truffle_risotto:
      name: "Truffle Risotto"
      colour: "#5A453A"
      family: farming
      base: cooked_beef
      nutrition: 12
      saturation: 16.0
      effects: [{type: luck, amplifier: 1, minutes: 5}]
      rare: true
      ingredients: ["forage:truffle", "forage:wild_rice", "forage:onion", milk_bucket, bowl]
      flavour: "Slow, creamy, and worth every shaving."
      hint: "A rarity. The truffle hides in the oldest forests."
    harvest_feast:
      name: "Harvest Feast"
      colour: "#D98A2E"
      family: farming
      base: pumpkin_pie
      nutrition: 12
      saturation: 16.0
      effects: [{type: hero_of_the_village, minutes: 5}]
      rare: true
      ingredients: [pumpkin, wheat, egg, honey_bottle, "meat:cooked", "forage:wild_herbs"]
      flavour: "Everything the year gave, on one table, for everyone."
      hint: "A feast for a good year. It wants a bit of everything."
