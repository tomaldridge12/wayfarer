# Banners module. Set enabled: false to skip the module at startup.
version: 1
enabled: true

# A mob family is a group of entity types that count as one kind of mob.
# A type may be in only one family; a family breaking that rule (or naming an unknown type) is rejected.
families:
  zombie: [zombie, husk, drowned]
  skeleton: [skeleton, stray, bogged]
  creeper: [creeper]
  spider: [spider, cave_spider]
  enderman: [enderman]

# Which kills count. Spawn reasons are Paper's CreatureSpawnEvent.SpawnReason names. Listing them replaces the
# default list, so include all you want excluded. "custom" (used by MythicMobs) is deliberately not excluded.
# Tamed and leashed mobs, and kills not made by a player (or their projectile), never count.
counting:
  exclude-spawn-reasons: [spawner, trial_spawner, ominous_item_spawner, spawner_egg, slime_split, breeding, egg, dispense_egg]
  min-mob-lifetime-ticks: 0   # 0 = off; mobs younger than this many ticks do not count
  all-mobs: hostile           # the "all" kill count: hostile mobs only (hostile), or every counted mob (any)

# How players are told about boosts. There is deliberately no sound.
feedback:
  action-bar: true            # styled message on entering and leaving a boost zone
  show-blocked: true          # action bar flash when a banner softens a hit on you
  damage-numbers:             # a floating number over every mob a player hits; boosted hits add ▲ and the extra in red
    enabled: true
    max-active: 40            # new ones are skipped while this many exist
    lifetime-ticks: 20        # about one second (at most 59)
    view-distance: 16         # only players this close see them
  edge-particles:             # rings marking each zone's edge, drawn every half second
    enabled: false
    particle: happy_villager
    max-per-update: 64        # cap on particles drawn per update, across all players
  marker-effect:              # a potion effect while in any zone, so the HUD shows an icon
    enabled: false
    effect: luck              # careful: Luck raises loot quality (chests, fishing), so it is a real buff

# Per banner: name, colour (base dye colour), patterns (list of pattern:colour), family, kills,
# damage-bonus and damage-reduction (whole percent), radius (blocks). Omitted numbers use the values below.
# Optional drops: a chance (above 0, at most 1) that killing that mob type awards the banner to every
# player who damaged it, for example on a vanilla boss:
#     drops:
#       wither: 0.5
#       elder_guardian: 1.0
banners:
  zombie:
    name: "Zombie Banner"
    colour: green
    patterns: ["creeper:lime", "border:black"]
    family: zombie
    kills: 100
    damage-bonus: 10
    damage-reduction: 10
    radius: 16
  skeleton:
    name: "Skeleton Banner"
    colour: white
    patterns: ["skull:black"]
    family: skeleton
    kills: 100
    damage-bonus: 10
    damage-reduction: 10
    radius: 16
  creeper:
    name: "Creeper Banner"
    colour: lime
    patterns: ["creeper:black"]
    family: creeper
    kills: 100
    damage-bonus: 10
    damage-reduction: 10
    radius: 16
  spider:
    name: "Spider Banner"
    colour: black
    patterns: ["circle:red", "cross:black"]
    family: spider
    kills: 100
    damage-bonus: 10
    damage-reduction: 10
    radius: 16
  enderman:
    name: "Enderman Banner"
    colour: purple
    patterns: ["border:black", "circle:magenta"]
    family: enderman
    kills: 100
    damage-bonus: 10
    damage-reduction: 10
    radius: 16

# Trophy heads on each family's ladder. Placed, a head shows its earner's live kill count.
heads:
  zombie:
    name: "Zombie Trophy"
    family: zombie
    kills: 250
  skeleton:
    name: "Skeleton Trophy"
    family: skeleton
    kills: 250
  spider:
    name: "Spider Trophy"
    family: spider
    kills: 250
  creeper:
    name: "Creeper Trophy"
    family: creeper
    kills: 150
  enderman:
    name: "Enderman Trophy"
    family: enderman
    kills: 150

# Relics: a themed weapon and one armour piece per family, in two tiers (I iron-level, II diamond-level).
# kills: the family's kill count needed ('all' is the all-mobs count). item: the base item (never netherite).
# edge: the family edge in percent (weapons: extra damage to the family; armour: less damage from it); omitted
# means weapons 30 / 40 and armour 25 / 30 by tier. trim: pattern:material for armour. enchants: preset levels,
# kept at or below each enchant's maximum. perks: from the fixed library (hunger_immunity, poison_immunity,
# no_knockback, arrow_saver, projectile_ward, cobweb_walker, fall_cushion, knock_away, explosion_ward,
# enderman_calm, pearl_mastery) with family and amount where needed; excellentenchants: entries need the ExcellentEnchants plugin and
# work only on the items that plugin allows (e.g. Thunder lists swords and axes).
relics:
