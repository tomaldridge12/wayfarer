# Bosses (from the bosses module): each boss is its own family on the ladder. base: the mob family a mini boss belongs
# to (its Ascended relics drop from it, and that family's relics and banners also work against it).
bosses:
  count-toward-base-family: false   # true: a mini boss kill also counts toward its base family's kill count
  loot:                             # personal rolls for every player who damaged the boss
    ascended-chance: [0.05, 0.12, 0.20, 0.27, 0.35]   # by stars; mini bosses only
    legendary-chance: [0.01, 0.025, 0.04, 0.06, 0.08] # by stars
    xp-per-star: 60                                   # dropped once at the boss
    materials:                                        # per player: [min, max] times the stars
      emerald: [2, 4]
      experience_bottle: [1, 2]
  families:
    rotting_warlord: {base: zombie}
    bone_marshal: {base: skeleton}
    brood_mother: {base: spider}
    blast_prophet: {base: creeper}
    void_stalker: {base: enderman}
    bog_witch_queen: {base: ""}
    sand_pharaoh: {base: ""}
    drowned_captain: {base: ""}
    piglin_warlord: {base: ""}
  legendaries:                      # the Legendary relic each boss can drop
    rotting_warlord: gravecleaver
    bone_marshal: marshals_longbow
    brood_mother: broodfang
    blast_prophet: prophets_maul
    void_stalker: voidwalkers
    bog_witch_queen: hexbloom_crown
    sand_pharaoh: pharaohs_khopesh
    drowned_captain: captains_trident
    piglin_warlord: warlords_greataxe
