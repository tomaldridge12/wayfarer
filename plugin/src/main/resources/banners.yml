# Banners module. Set enabled: false to skip the module at startup.
version: 1
enabled: true

# A mob family is a group of entity types that count as one kind of mob.
# A type may be in only one family; a family breaking that rule (or naming an unknown type) is rejected.
families:
  zombie: [zombie, husk, drowned]
  skeleton: [skeleton, stray, bogged]
  creeper: [creeper]
  spider: [spider, cave_spider]
  enderman: [enderman]

# Which kills count at all (spawn reasons, minimum lifetime) is in progression.yml.
counting:
  all-mobs: hostile           # the "all" ladder reads kills of hostile mobs only (hostile), or of every mob (any)

# How players are told about boosts and rewards. The only sound is the fanfare when you earn a reward.
feedback:
  action-bar: true            # styled message on entering and leaving a boost zone
  show-blocked: true          # action bar flash when a banner softens a hit on you
  announce-earned: true       # tell everyone when someone earns a banners reward (hover shows the item); never for claims
  damage-numbers:             # a floating number over every mob a player hits; boosted hits add ▲ and the extra in red
    enabled: true
    max-active: 40            # new ones are skipped while this many exist
    lifetime-ticks: 20        # about one second (at most 59)
    view-distance: 16         # only players this close see them
  edge-particles:             # rings marking each zone's edge, drawn every half second
    enabled: false
    particle: happy_villager
    max-per-update: 64        # cap on particles drawn per update, across all players
  marker-effect:              # a potion effect while in any zone, so the HUD shows an icon
    enabled: false
    effect: luck              # careful: Luck raises loot quality (chests, fishing), so it is a real buff

# Per banner: name, colour (base dye colour), patterns (list of pattern:colour), family, kills,
# damage-bonus and damage-reduction (whole percent), radius (blocks). Omitted numbers use the values below.
# Optional drops: a chance (above 0, at most 1) that killing that mob type awards the banner to every
# player who damaged it, for example on a vanilla boss:
#     drops:
#       wither: 0.5
#       elder_guardian: 1.0
