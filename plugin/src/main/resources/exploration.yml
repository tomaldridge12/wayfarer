# Exploration module: the Wayfinder compass and Guardian's Chart, safe surface after the first dragon, and beacon
# kindling. Set enabled: false to skip the module.
version: 2
enabled: true

# Sneak and right-click a cartography table with a compass to choose a structure or any biome this world can grow;
# pay XP and the compass points to the nearest within range. Prices are XP points, the same at any level (a level
# 5 and a level 40 player pay alike); players see them as "27 XP · about 2 of your levels". A search is one per player per
# cooldown (seconds). A search that finds nothing costs nothing but still starts the cooldown.
# Older files priced in levels (version 1: structure-levels, biome-levels, chart-levels, rare in levels) are still read, each
# level number converted to the points it takes to reach that level from 0; the file is never rewritten.
wayfinder:
  range: 3200
  cooldown: 300
  structure-points: 55
  biome-points: 27
  chart-points: 112
  # A biome you have not found yet costs this many times as much (it also shows the Atlas hint).
  unfound-multiplier: 2
  # Rarer targets cost more (structure or biome path -> XP points).
  rare: {mansion: 315, ancient_city: 216, stronghold: 160, monument: 112, trial_chambers: 112, end_city: 160, bastion_remnant: 112,
    fortress: 72, jungle_pyramid: 72, mushroom_fields: 160, ice_spikes: 112, pale_garden: 112, deep_dark: 160, cherry_grove: 72,
    bamboo_jungle: 72, badlands: 72}

  # The structures it offers, in this order (key -> name shown).
  structures:
    village_plains: "Plains Village"
    village_desert: "Desert Village"
    village_savanna: "Savanna Village"
    village_taiga: "Taiga Village"
    village_snowy: "Snowy Village"
    pillager_outpost: "Pillager Outpost"
    desert_pyramid: "Desert Pyramid"
    jungle_pyramid: "Jungle Temple"
    swamp_hut: "Witch Hut"
    igloo: "Igloo"
    shipwreck: "Shipwreck"
    ocean_ruin_warm: "Warm Ocean Ruin"
    ocean_ruin_cold: "Cold Ocean Ruin"
    ruined_portal: "Ruined Portal"
    trail_ruins: "Trail Ruins"
    trial_chambers: "Trial Chambers"
    monument: "Ocean Monument"
    mansion: "Woodland Mansion"
    ancient_city: "Ancient City"
    stronghold: "Stronghold"
    fortress: "Nether Fortress"
    bastion_remnant: "Bastion Remnant"
    end_city: "End City"

# Beacon kindling (from the shop): right-click a lit campfire; it burns as a signal for seconds, and a wandering
# trader arrives trader-after seconds in.
beacon-kindling:
  seconds: 90
  trader-after: 12
