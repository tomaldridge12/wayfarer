# Wayfarer progression: what players do, counted per player as activities (kill:husk, mine:sand, ...).
# Every module's ladders read these counters.
version: 1

# Which kills count, for every counter and ladder. Spawn reasons are Paper's CreatureSpawnEvent.SpawnReason names.
# Listing them replaces the default list, so include all you want excluded. "custom" (used by MythicMobs) is
# deliberately not excluded. Tamed and leashed mobs, and kills not made by a player (or their projectile), never count.
counting:
  exclude-spawn-reasons: [spawner, trial_spawner, ominous_item_spawner, spawner_egg, slime_split, breeding, egg, dispense_egg]
  min-mob-lifetime-ticks: 0   # 0 = off; mobs younger than this many ticks do not count

# Who hears about an earning. Each category tells the whole server in chat (hover shows what was earned); false silences
# it. Ordinary dailies and weeklies are never announced. Missing switches stay on.
announce:
  feat: true
  boss-defeat: true
  ascended-drop: true
  legendary-drop: true
  server-goal: true
  streak: true
  ladder-rung: true           # banner, head, relic, mark and other ladder rewards (a mark announces only its top rank)

# Pity drops: a ceiling on bad luck for rare mob drops. The ceil(1 / chance)-th counted kill in a row without the
# item (1 / 0.025 = 40) drops it. Only the player who landed the killing blow advances their
# counter; a real drop of the item resets it. Looting improves the real chance but never changes the threshold.
# held-item: only mobs holding this item count (a drowned with a trident).
pity:
  wither_skeleton_skull:
    item: wither_skeleton_skull
    mobs: [wither_skeleton]
    chance: 0.025   # vanilla base chance
  trident:
    item: trident
    mobs: [drowned]
    held-item: trident
    chance: 0.085   # vanilla chance a drowned drops its held trident (an equipment drop, not a loot table)

# Stage snapshots: when a player earns one of these advancements, one line with all their counters is appended to
# plugins/Wayfarer/stage-snapshots.csv, for tuning ladder thresholds against real play. Players never see it.
snapshots:
  markers:
    - story/smelt_iron         # Acquire Hardware
    - story/mine_diamond       # Diamonds!
    - story/enter_the_nether   # We Need to Go Deeper
    - nether/netherite_armor   # Cover Me in Debris
    - end/kill_dragon          # Free the End
    - end/elytra               # Sky's the Limit
