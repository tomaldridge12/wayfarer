name: Wayfarer
version: ${version}
main: dev.wayfarer.WayfarerPlugin
api-version: "26.3"
permissions:
  wayfarer.pack.admin:
    description: See the resource pack's status, resend it, and give pack model test items
    default: op
  wayfarer.progression.stats:
    description: List any player's activity counters
    default: op
  wayfarer.progression.setcount:
    description: Set any player's activity counter (testing and repairs)
    default: op
  wayfarer.banners.reload:
    description: Reload the banners config
    default: op
  wayfarer.banners.give:
    description: Give a banner item to a player
    default: op
  wayfarer.banners.progress:
    description: View your own progress on every ladder
    default: true
  wayfarer.banners.progress.others:
    description: View another player's progress
    default: op
  wayfarer.banners.claim:
    description: Claim a copy of a reward you have earned
    default: true
  wayfarer.banners.place:
    description: Stand a banner at a position (testing tool)
    default: op
  wayfarer.banners.forcedrop:
    description: Award a banner as a successful drop would (testing tool)
    default: op
  wayfarer.bosses.admin:
    description: Spawn, list and remove bosses (testing tools)
    default: op
  wayfarer.alloys.admin:
    description: List alloys, give alloy items and reload alloys.yml (testing tools)
    default: op
