# Collections module: the Journal (every player's book of pages) and its collections. Each collection is a Journal page
# that asks you to find every one of something; milestones on it pay reward loot. Everything you found before a
# collection existed already counts. Set enabled: false to skip the module (its pages and ladders go with it).
version: 1
enabled: true

journal:
  # Every player gets the Journal item once, on their first join after this module starts.
  book-on-first-join: true
  # How many entries one Journal page shows before turning over.
  entries-per-page: 16

# Each collection:
#   title, colour (#RRGGBB), blurb (one line under the title), unit (one entry, singular|plural)
#   milestones: "10" (a count) or "25%" (a share of the collection, rounded up) -> rewards ("curio:bone_dice",
#     "supply:seed_bundle", "gear:old_strike", "enchant:<key>_<level>", "supply:animal_crate*2" for two).
#     Each reward is earned once per player, so a reward string may appear only once across all collections.
#   hints: what an entry you have not found yet says (keys: mob type, biome/<key>, structure/<group>, item).
collections:
  bestiary:
    title: "Bestiary"
    colour: "#C25B4A"
    blurb: "Every creature you have felled, and every boss you have beaten."
    unit: "creature"
    milestones:
      "10": [supply:tome_of_experience]
      "25%": [curio:bone_dice]
      "50%": [curio:hunters_tooth]
      "100%": ["enchant:excellentenchants:decapitator_1"]
    # Never asked for: unkillable, unobtainable, or a friend nobody should have to hurt.
    exclude: [giant, illusioner, mannequin, villager, wandering_trader, allay, player, armor_stand]
    hints:
      armadillo: "Rolls into a ball in the savanna and the badlands."
      axolotl: "Smiles up at you from the water of lush caves."
      bat: "Squeaks in the dark of any cave."
      bee: "Busy around flowers and hives in the meadows."
      blaze: "Burns and floats in Nether fortresses."
      bogged: "A mossy archer that rises in swamps and trial chambers."
      breeze: "Whirls through the corridors of trial chambers."
      camel: "Plods through desert villages, two humps and all."
      camel_husk: "Something long dead rides the dunes at night."
      cat: "Naps in villages and sits by witches' huts."
      cave_spider: "Guards the cobwebbed spawners of old mineshafts."
      chicken: "Scratches about on almost any grassy plain."
      cod: "Shoals in cold and temperate oceans."
      copper_golem: "Built from copper and a carved pumpkin. Tidies chests."
      cow: "Grazes grasslands warm, cold and in between."
      creaking: "Stands still in the pale garden while you watch it."
      creeper: "Hisses behind you. Any dark place, anywhere."
      dolphin: "Leaps beside boats in warm and temperate seas."
      donkey: "Wanders the plains and savanna in small herds."
      drowned: "Walks the riverbeds and ocean floors, sometimes with a trident."
      elder_guardian: "Rules the heart of an ocean monument. There are three."
      ender_dragon: "Circles the obsidian towers at the End."
      enderman: "Tall and silent; don't meet its eyes. Thick in the warped forest."
      endermite: "Sometimes crawls out where an ender pearl lands."
      evoker: "Casts fangs from the floor in woodland mansions and raids."
      fox: "Sleeps by day in the taiga and pounces on chickens by night."
      frog: "Croaks in swamps; its colour follows the climate."
      ghast: "Wails and spits fire over the Nether's open wastes."
      glow_squid: "Lights the deep water of caves."
      goat: "Rams the unwary off snowy slopes and peaks."
      guardian: "Lasers from the walls of ocean monuments."
      happy_ghast: "Grown from a dried ghast. Gentle. Please be gentle."
      hoglin: "Charges through the crimson forest."
      horse: "Gallops across plains and savanna."
      husk: "A zombie the desert sun can't burn."
      iron_golem: "Guards villages. It will not thank you."
      llama: "Spits from the windswept hills and savanna."
      magma_cube: "Bounces through basalt deltas and fortresses."
      mooshroom: "Grazes only on the mushroom fields."
