# Bosses module. Set enabled: false to skip the module at startup.
version: 1
enabled: true

# Stars (1-5) multiply a boss's base health and damage. Index 0 is one star.
stars:
  health: [1.0, 1.5, 2.2, 3.0, 4.0]
  damage: [1.0, 1.2, 1.45, 1.75, 2.1]

# Bosses appear on their own (see each boss's spawn section). Stars come from distance to world spawn: one more
# star beyond each distance below, sometimes one extra; structure guardians are never below guardian-min-stars.
spawning:
  star-distances: [750, 2000, 4000, 7000]
  guardian-min-stars: 3
  extra-star-chance: 0.25

# Each boss is its own mob family on the ladder. health and damage are at one star (a one-star boss is meant to be
# beatable in iron gear with some preparation). cooldown-minutes: how long before it can appear again in a world.
# Variants: entity (a vanilla mob), glow (a text colour name), scale (size, 1 = normal), equipment by slot (head,
# chest, legs, feet, hand, offhand), colours (name gradient, two #hex values) and abilities from the library:
# charge, ground_slam, summon_minions, poison_cloud, arrow_volley, blink, fire_ring, pull, shield, enrage.
# spawn: entity (whose natural spawn can become the boss), biomes (a list, or any), chance per natural spawn,
# biomes may be names (plains, terralith:desert_canyon) or biome tags (#minecraft:is_forest). Tags make lists work with
# datapacks like Terralith, which adds its biomes to the vanilla tags; a tag the server lacks (e.g. #c:is_cave without
# Terralith) is skipped with a note.
# night-only, and structures it guards (it appears when a player goes inside, at most once per cooldown).
bosses:
  rotting_warlord:
    name: "Rotting Warlord"
    health: 100
    damage: 6
    cooldown-minutes: 60
    spawn:
      entity: zombie
      biomes: ["#minecraft:is_forest", "#minecraft:has_structure/village_plains", meadow]
      chance: 0.0004
      night-only: true
    variants:
      rotting_warlord:
        name: "Rotting Warlord"
        entity: zombie
        glow: dark_green
        scale: 1.5
        colours: ["#B7E07A", "#3E7A1E"]
        equipment: {head: iron_helmet, chest: iron_chestplate, hand: iron_axe}
        abilities: [charge, ground_slam]
      plague_bearer:
        name: "Plague Bearer"
        entity: zombie
        glow: green
        scale: 1.4
        colours: ["#D6FF8A", "#5E8C2A"]
        equipment: {head: leather_helmet, chest: chainmail_chestplate}
        abilities: [poison_cloud, summon_minions]
      grave_caller:
        name: "Grave Caller"
        entity: husk
        glow: dark_gray
        scale: 1.4
        colours: ["#E8D9B0", "#6B5B3A"]
        equipment: {head: golden_helmet, hand: stone_hoe}
        abilities: [summon_minions, pull]

