# Marks module: ladders for the dull jobs. Each rank of a mark gives its template; at the smithing table the template,
# a tool of the mark's type (vanilla or alloy) and the mark's material put the mark on the tool, and the template
# stays in the table. A higher rank replaces a lower one. Set enabled: false to skip the module.
# Every number here is a first pass, to be tuned from the stage snapshots (progression.yml).
version: 1
enabled: true

# Each mark:
#   counts: the activities its ladder sums (verb:target; verb:#namespace:tag expands a tag; verb:* is every target)
#   ranks-at: the count that earns each rank (rank I about iron, II diamond, III the Nether)
#   tool: shovel, shears, fishing_rod or hoe; material: what goes in the smithing table's third slot (items or #tags)
#   unit: one step of the ladder in progress text (singular|plural when the plural is not just an s)
#   ranks: what each rank does. Dune and Reaper: area (width x depth; depth 1 is a row across the way you face).
#          Dune gravel: also digs gravel (never suspicious sand or gravel). Shepherd: radius in blocks, extra-wool chance.
#          Angler: bite-wait (0.85 = bites come 15% sooner), treasure (chance a catch becomes a treasure roll).
marks:
  dune:
    name: "Dune"
    colour: "#E3C27A"
    unit: "block"
    counts: [mine:sand, mine:red_sand]
    ranks-at: [500, 2500, 8000]
    tool: shovel
    material: [sand, red_sand]
    ranks:
      - {area: 3x1}
      - {area: 3x3}
      - {area: 3x3, gravel: true}

  shepherd:
    name: "Shepherd"
    colour: "#F2F2F2"
    unit: "sheep|sheep"
    counts: [shear:sheep]
    ranks-at: [50, 250, 750]
    tool: shears
    material: ["#minecraft:wool"]
    ranks:
      - {radius: 3}
      - {radius: 5}
      - {radius: 7, extra-wool: 0.25}

  angler:
    name: "Angler"
    colour: "#5DA9E9"
    unit: "catch|catches"
    counts: ["catch:*"]
    ranks-at: [100, 500, 1500]
    tool: fishing_rod
    material: [string]
    ranks:
      - {bite-wait: 0.85}
      - {bite-wait: 0.70, treasure: 0.05}
      - {bite-wait: 0.55, treasure: 0.10}

  reaper:
    name: "Reaper"
    colour: "#D9B44A"
    unit: "crop"
    counts: ["harvest:*"]
    ranks-at: [500, 2500, 8000]
    tool: hoe
    material: [hay_block]
    ranks:
      - {area: 3x1}
      - {area: 3x3}
      - {area: 5x5}

# Ladders that pay ExcellentEnchants books, one level per threshold. These books are the only way to get these
# enchants: see docs/wayfarer-relic-enchants.md to lock them down in ExcellentEnchants (and raise MaxLevel to 3).
books:
  veinminer:
    name: "Veinminer"
    enchant: excellentenchants:veinminer
    unit: "ore"
    counts:
      - "mine:#minecraft:coal_ores"
      - "mine:#minecraft:iron_ores"
      - "mine:#minecraft:copper_ores"
      - "mine:#minecraft:gold_ores"
      - "mine:#minecraft:redstone_ores"
      - "mine:#minecraft:lapis_ores"
      - "mine:#minecraft:diamond_ores"
      - "mine:#minecraft:emerald_ores"
      - mine:nether_quartz_ore
    levels-at: [250, 1000, 3000]

  treefeller:
    name: "Treefeller"
    enchant: excellentenchants:treefeller
    unit: "log"
    counts: ["mine:#minecraft:logs"]
    levels-at: [500, 2000, 6000]
